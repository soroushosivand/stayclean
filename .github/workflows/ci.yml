name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n mac/stayclean-mac.sh && bash -n repo/scan-repo.sh
      - run: shellcheck -S error mac/stayclean-mac.sh repo/scan-repo.sh

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./

  detects-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scanner must flag a planted payload
        run: |
          T=$(mktemp -d) && cd "$T" && git init -q -b main
          { echo "module.exports={}"; printf '%400s' ''; echo "x()"; } > babel.config.js
          git add . && git -c user.email=ci@x -c user.name=ci commit -qm test
          if bash "$GITHUB_WORKSPACE/repo/scan-repo.sh" "$T"; then echo "missed the payload"; exit 1; fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Mac scanner (clean runner; warnings are fine)
        run: |
          set +e
          out=$(bash mac/stayclean-mac.sh --report "$RUNNER_TEMP/r"); code=$?
          echo "$out"; cat "$RUNNER_TEMP"/r/*.md
          echo "$out" | grep -qE '^RESULT (clean|warnings|INFECTED)' || { echo "RESULT line missing"; exit 1; }
          FORCE_COLOR=1 bash mac/stayclean-mac.sh | grep -q 'RESULT' || { echo "RESULT line missing with color"; exit 1; }
          [ $code -ne 1 ]

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows scanner (clean runner; warnings are fine)
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File windows/stayclean-win.ps1 -Report -ReportDir "$env:RUNNER_TEMP\r"
          $code = $LASTEXITCODE
          $out
          Get-Content "$env:RUNNER_TEMP\r\*.md"
          if (-not ($out -match '^RESULT (clean|warnings|INFECTED)')) { Write-Error "RESULT line missing"; exit 1 }
          if ($code -eq 1) { exit 1 }
          exit 0
      - name: Banner path must also print RESULT
        shell: pwsh
        run: |
          $all = powershell -NoProfile -ExecutionPolicy Bypass -File windows/stayclean-win.ps1 -Color *>&1 | Out-String
          $all
          if ($all -notmatch 'RESULT (clean|warnings|INFECTED)') { Write-Error "RESULT line missing with -Color"; exit 1 }
          exit 0
